- url: >-
    https://res.cloudinary.com/duugpqtue/image/upload/v1766348916/_00001_h6oaxe.jpg
  public_id: Andromeda_galaxy
  title: ANDROMEDA GALAXY
  caption:
    Andromeda galaxy taken from Namdalseid, Norway. About 50 min of total exposure time, along with calibration frames stacked in SIRIL and stretched in photoshop
    Its the closest spiral galaxy to our Milky Way, but still 2.5 million years away! With over a trillion stars. This is probably my favorite photo i have taken of all time. 
    The fact that i, an amateur photographer with a normal camera (fujixt30) and a startracker is able to take photo of this galaxy with so many stars and so much possibility of life so so far away i find really really cool.
    Its not a conspiracy people! These distant worlds are just chilling above our heads without people thinking too much of them. To the naked eye it looks like a fuzzy dim blob in the night sky, but when you see the detail its so freaking cool!!!!
  category: astro
  featured: true
